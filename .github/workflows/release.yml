name: UmbraProxy Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # تقليل عمق الجلب لتسريع التحميل

      # 1. إعداد Go مع تفعيل الكاش التلقائي للموديلات والبناء
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # تم التحديث لمطابقة go.mod
          cache: true

      # 2. إعداد Java و Gradle مع أقوى نظام كاش متاح حالياً
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. استخدام أداة Gradle المتطورة (تتعامل مع الكاش بذكاء شديد للمكتبات والـ Wrapper)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      # 4. تخزين الـ NDK يدوياً لأنه يأخذ وقتاً طويلاً في التحميل
      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/r26b
          key: ${{ runner.os }}-ndk-r26b

      - name: Setup Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      # 5. بناء المكتبة البرمجية لمعماريات arm64 و armv7
      - name: Build Native Libraries (arm64 & armv7)
        run: |
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          
          # Build arm64-v8a (64-bit) with 16KB alignment for Android 15+
          mkdir -p app/src/main/jniLibs/arm64-v8a
          export CC_ARM64=$TOOLCHAIN/bin/aarch64-linux-android34-clang
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC=$CC_ARM64 \
          go build -v -buildmode=c-shared \
          -ldflags="-w -s -linkmode=external -extldflags=-Wl,-z,common-page-size=16384,-z,max-page-size=16384" \
          -o app/src/main/jniLibs/arm64-v8a/libumbraproxy.so tg-ws-proxy.go
          
          # Build armeabi-v7a (32-bit)
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          export CC_ARM32=$TOOLCHAIN/bin/armv7a-linux-androideabi34-clang
          GOOS=android GOARCH=arm GOARM=7 CGO_ENABLED=1 CC=$CC_ARM32 \
          go build -v -buildmode=c-shared \
          -ldflags="-w -s -linkmode=external" \
          -o app/src/main/jniLibs/armeabi-v7a/libumbraproxy.so tg-ws-proxy.go

      # 6. بناء الـ APK مع تمرير بارامترات السرعة لـ Gradle
      - name: Build Unsigned APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --build-cache --configuration-cache -Porg.gradle.jvmargs="-Xmx4096m"

      - name: Create Auto Tag
        id: create_tag
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
