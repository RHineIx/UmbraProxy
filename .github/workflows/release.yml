name: UmbraProxy release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Build native libraries
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" bash scripts/build-native.sh
      - name: Test and build unsigned candidate
        run: |
          go vet ./...
          go test -race ./...
          bash gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace
      - name: Read application version
        id: version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          echo "tag=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-candidate
          path: app/build/outputs/apk/release/*.apk
      - name: Prepare draft release for signing and review
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: Unsigned candidate ${{ steps.version.outputs.tag }}
          draft: true
          body: These APKs are unsigned build candidates. Sign them with the existing application key and verify on a device before publishing.
          files: app/build/outputs/apk/release/*.apk
