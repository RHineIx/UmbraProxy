name: UmbraProxy Production Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Build Native Library (16KB Aligned)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC=$TOOLCHAIN/bin/aarch64-linux-android34-clang
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC=$CC \
          go build -buildmode=c-shared \
          -ldflags="-linkmode=external -extldflags=-Wl,-z,common-page-size=16384,-z,max-page-size=16384" \
          -o app/src/main/jniLibs/arm64-v8a/libumbraproxy.so tg-ws-proxy.go

      - name: Build Unsigned APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create Auto Tag
        id: create_tag
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
